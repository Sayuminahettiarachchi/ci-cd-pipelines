
name: Python CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-check:
    name: Python Syntax and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python version
        run: python --version

      - name: Check Python syntax
        run: python -m compileall -q app.py test_app.py

      - name: Run unit tests
        run: python -m unittest -v test_app
